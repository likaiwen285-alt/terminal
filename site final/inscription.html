<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification - 4ème HP | Institut Ndahura</title>
    <link rel="stylesheet" href="ken.css">
</head>
<body class="body-auth">

    <main class="auth-container">
        <!-- Lien Retour Accueil -->
        <a href="index.html" class="btn-retour" aria-label="Retourner à la page d'accueil">
            <svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span>Retour à l'accueil</span>
        </a>

        <div class="auth-box">
            <!-- Zone Identité Visuelle -->
            <header class="auth-header-brand">
                <div class="logo-placeholder" aria-hidden="true">4HP</div>
                <h1>INSTITUT NDAHURA</h1>
                <p class="subtitle" id="auth-subtitle">Portail de Connexion Élèves</p>
            </header>

            <!-- Bannière d'erreur globale -->
            <div id="global-error" class="error-banner" role="alert" aria-live="assertive" style="display: none;"></div>

            <!-- FORMULAIRE 1 : CONNEXION -->
            <form id="form-login" action="acceuil/index.html" method="POST" autocomplete="on">
                <div class="input-group">
                    <label for="login-identifiant">Identifiant ou Adresse Email</label>
                    <input type="text" id="login-identifiant" name="username" placeholder="Ex: alame_ndahura" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="login-password">Mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" data-target="login-password" aria-label="Afficher le mot de passe">
                            <svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="options-auth">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember_me"> Se souvenir de moi
                    </label>
                    <a href="#" class="link-forgot">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn-auth">Ouvrir la session</button>
                
                <footer class="auth-footer">
                    <p>Nouvel élève ? <a href="#" id="link-to-register">Créer un compte promotion</a></p>
                </footer>
            </form>

            <!-- FORMULAIRE 2 : INSCRIPTION -->
            <form id="form-register" action="acceuil/index.html" method="POST" style="display: none;" autocomplete="off">
                <div class="input-group">
                    <label for="reg-username">Nom complet (Nom & Prénom)</label>
                    <input type="text" id="reg-username" name="fullname" placeholder="Ex: Alame NDAHURA" required minlength="3">
                </div>

                <div class="input-group">
                    <label for="reg-email">Adresse Email académique</label>
                    <input type="email" id="reg-email" name="email" placeholder="Ex: eleve@ndahura.com" required>
                </div>

                <div class="input-group">
                    <label for="reg-password">Créer un mot de passe sécurisé</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" name="password" placeholder="6 caractères minimum" required minlength="6">
                        <button type="button" class="toggle-password" data-target="reg-password" aria-label="Afficher le mot de passe">
                            <svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <div class="strength-container" aria-live="polite">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <span id="strength-text" class="strength-text"></span>
                </div>

                <div class="input-group">
                    <label for="reg-confirm">Confirmer le mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-confirm" name="confirm_password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" data-target="reg-confirm" aria-label="Afficher le mot de passe">
                            <svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-auth">Soumettre l'inscription</button>
                
                <footer class="auth-footer">
                    <p>Déjà enregistré ? <a href="#" id="link-to-login">Se connecter</a></p>
                </footer>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
